[package]
name = "simple-image-viewer"
version = "3.1.5"
edition = "2024"
description = "A high-performance, cross-platform image viewer"
license = "GPL-3.0-only"
build = "build.rs"
default-run = "SimpleImageViewer"

[[bin]]
name = "SimpleImageViewer"
path = "src/main.rs"

[dependencies]
rand = "0.8"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "monochrome_emoji_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
rust-i18n = "4"
# AVIF decode/encode: use libavif (`avif-native`), not `image`'s `avif` (ravif — bloated, encode-only there).
image = { version = "0.25", default-features = false, features = [
    "png", "gif", "bmp", "tga", "webp", "ico", "pnm", "hdr", "qoi",
] }
parking_lot = "0.13"
arc-swap = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "wav", "vorbis", "symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis", "symphonia-aac"] }
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.25"
encoding_rs = "0.8"
rfd = "0.17"
walkdir = "2"
jwalk = "0.9"
# tiff = "0.11" // Removed in favor of libtiff via libloading on Linux and WIC/ImageIO elsewhere
crossbeam-channel = "0.5"
rayon = "1.12"
log = "0.4"
flexi_logger = { version = "0.31", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
font-kit = "0.14"
ttf-parser = "0.25"
kamadak-exif = "0.6.1"
clipboard-rs = "0.3"
wallpaper = "3.2.0"
interprocess = "2.4.0"
trash = "5"
# Linux turns on libappindicator in the target table below. Defaults stay off so Windows does not pull GTK.
tray-icon = { version = "0.26", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
xmpkit = { version = "0.1", default-features = false, features = ["gif", "jpeg", "png", "psd", "tiff", "webp"] }
quick-xml = "0.42"
wgpu = { version = "30", default-features = false, features = [
    "dx12",
    "vulkan",
    "metal",
    "wgsl",
    "gles",
    "parking_lot",
] }
# Optional: enables patched wgpu-hal feature flags on the same crate graph as `wgpu`.
wgpu-hal = { version = "30", default-features = false, optional = true }
memmap2 = "0.9"
# Do not enable mimalloc's own `extended` feature. Its StatsJson wrapper mixes
# core::ffi::c_char with cty::c_char and fails on aarch64-pc-windows-msvc
# (rustc 1.99: NonNull<i8> vs NonNull<u8>). Option tuning uses libmimalloc-sys.
mimalloc = { version = "=0.1.52", optional = true }
# Pin libmimalloc-sys to the 0.1.49 line (bundled mimalloc C 3.3.2; fixes Windows ARM64 #1277).
# `extended` stays here so mi_option_set_default remains available.
libmimalloc-sys = { version = "=0.1.49", features = ["extended"], optional = true }
moka = { version = "0.12.15", features = ["sync"] }
pollster = "0.4.0"
libraw-sys = { path = "libraries/libraw-sys" }
monkey-sdk-sys = { path = "libraries/monkey-sdk-sys" }
libjpeg-turbo = { path = "libraries/libjpeg-turbo" }
libtiff-viewer = { path = "libraries/libtiff" }
openexr-core-sys = { path = "libraries/openexr-core-sys" }
libavif-sys = { path = "libraries/libavif-sys", optional = true }
libheif-sys = { path = "libraries/libheif-sys", optional = true }
libjxl-sys = { path = "libraries/libjxl-sys", optional = true }
bytemuck = "1.25.0"
half = { version = "2.7", default-features = false }
miniz_oxide = "0.9"
memchr = "2.8"

[features]
# OpenEXR + AVIF/HEIF/JPEG XL native HDR paths are on by default so CI and release
# builds exercise the full format set without extra --features flags.
default = ["openexr-core", "hdr-modern-formats", "mimalloc-allocator"]
# Production global allocator (matches CI / release builds).
mimalloc-allocator = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Local heap debugging: CRT allocator so GFlags Page Heap applies to Rust allocations.
# Build with: cargo build --release --no-default-features --features openexr-core,hdr-modern-formats,system-allocator
system-allocator = []
# Win7 legacy: GLES via bundled ANGLE (EGL + D3D11). Place libEGL.dll, libGLESv2.dll,
# and d3dcompiler_47.dll beside the exe (see redist/ for the Win7-safe compiler DLL).
legacy_win7 = [
    "wgpu/gles",
    "dep:wgpu-hal",
    "wgpu-hal/gles",
    "wgpu-hal/legacy-win7-gles",
]
# Diagnostic tools for tiled rendering (green borders and OSD stats)
tile-debug = []
# Detailed startup timing logs for local diagnostics. Keep disabled for consumer builds.
startup-timing = []
# Detailed preload/upload scheduling and RAW load-path diagnostics.
# Build with this feature, then run with SIV_LOG_LEVEL=info (optional SIV_LOG_FILE=1).
preload-debug = []
# Official OpenEXRCore C backend for EXR decoding.
openexr-core = []
avif-native = ["dep:libavif-sys"]
heif-native = ["dep:libheif-sys"]
jpegxl = ["dep:libjxl-sys"]
hdr-modern-formats = ["avif-native", "heif-native", "jpegxl"]

[lints.clippy]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "wingdi", "libloaderapi", "fileapi", "winbase"] }
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_Globalization",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types = "0.5"
tiff = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# tray-icon 0.26 compile_errors on Linux unless libappindicator or ksni is enabled.
# AlmaLinux CI already installs gtk3-devel and libappindicator-gtk3-devel for this backend.
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
printpdf = { version = "0.12", features = ["images"] }
# Known folders on Unix and on the non-Windows stub. Windows Places uses the Shell API.
dirs = "7"

# Build-time dependencies: only needed on Windows for PE resource embedding
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# image is needed by build.rs on all platforms for PNG→ICO conversion
[build-dependencies]
cc = "1.2.60"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

[patch.crates-io]
eframe = { path = "patched-crates/eframe" }
egui-wgpu = { path = "patched-crates/egui-wgpu" }
wgpu-hal = { path = "patched-crates/wgpu-hal" }
wgpu-core = { path = "patched-crates/wgpu-core" }
alsa-sys = { path = "patched-crates/alsa-sys" }
# vcpkg-rs 0.2.15 emits rustc-link-lib without `static=` on Linux/macOS; patched crate uses archives + optional LLD (root `build.rs`).
vcpkg = { path = "patched-crates/vcpkg" }

# Local `cargo build --release`: fast link (no LTO); still optimized.
[profile.release]
opt-level = 3
lto = "off"
codegen-units = 4
# Do NOT strip symbols: on MSVC targets `strip = true` deletes the .pdb
# entirely, making crash dumps useless.  `strip = "debuginfo"` keeps the
# .pdb but strips DWARF from the binary (relevant for cross-compiled ELF).
# The .pdb is NOT shipped to users but archived separately in CI.
strip = "debuginfo"

# CI / shipped binaries: same LTO as `release` by default (`off` on Alma: fat LTO + vcpkg C++ can still
# surprise with bfd ld; `.cargo/g++-lld-wrap.sh` runs `g++ -fuse-ld=lld` unless `SIV_NO_LLD=1`). `codegen-units = 1`.
# Override: `CARGO_PROFILE_CI_LTO=thin|fat`.
# Use `cargo build --profile ci` → target/ci/.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 1

# Optional local aarch64-linux triple name; same fast settings as `release` (see `.cargo/config.toml` ARM flags).
[profile.release-a64-linux]
inherits = "release"

[profile.dev]
opt-level = 0

[dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
serde_json = "1"
